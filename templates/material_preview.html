<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ material.title }} Preview</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0a0d16;
        color: #fff;
        font-family: "Segoe UI", "SF Pro Display", sans-serif;
      }

      .preview-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .preview-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(12, 16, 28, 0.92);
      }

      .preview-title {
        min-width: 0;
      }

      .preview-title strong,
      .preview-title span {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .preview-title span {
        margin-top: 4px;
        color: rgba(255, 255, 255, 0.58);
        font-size: 0.92rem;
      }

      .preview-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .preview-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }

      .preview-frame {
        flex: 1;
        width: 100%;
        border: 0;
        background: #fff;
      }

      .preview-empty {
        display: grid;
        place-items: center;
        flex: 1;
        padding: 32px;
      }

      .preview-empty-card {
        width: min(520px, 100%);
        padding: 28px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
      }

      .preview-empty-card p {
        color: rgba(255, 255, 255, 0.72);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="preview-shell">
      <div class="preview-bar">
        <div class="preview-title">
          <strong>{{ material.title }}</strong>
          <span>{{ material.filename }}</span>
        </div>
        <div class="preview-actions">
          <a href="{{ download_url }}" class="preview-btn">Download</a>
        </div>
      </div>

      {% if preview_supported %}
      <iframe
        class="preview-frame"
        src="{{ preview_url }}"
        title="{{ material.title }} preview"
      ></iframe>
      {% else %}
      <div class="preview-empty">
        <div class="preview-empty-card">
          <h2>Preview not available</h2>
          <p>
            This file type ({{ extension|upper }}) can’t be shown inline here yet.
            Use the download button to open it on your device.
          </p>
          <a href="{{ download_url }}" class="preview-btn">Download File</a>
        </div>
      </div>
      {% endif %}
    </div>
  </body>
</html>
